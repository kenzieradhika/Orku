server {
    listen 80;
    server_name localhost;
    server_tokens off;
    root /workspace/Orku/examples/hello-world/public;
    index index.php;
    autoindex off;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /workspace/Orku/examples/hello-world/public/index.php;
        fastcgi_pass php:9000;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    location ~ /\. {
        return 404;
    }
}
