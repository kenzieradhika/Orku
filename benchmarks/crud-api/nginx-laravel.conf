server {
    listen 80;
    server_name _;
    root /crud/laravel/public;
    index index.php;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass laravel-fpm:9000;
    }

    location ~ /\. { deny all; }
}
