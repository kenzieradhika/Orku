events { worker_connections 32; }
http {
    limit_req_zone $binary_remote_addr zone=admission:1m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=concurrency:1m;
    server {
        listen 8080;
        root /var/www/html/examples/overload-lab/public;
        index index.php;
        client_max_body_size 8k;
        client_body_timeout 2s;
        send_timeout 3s;
        location / { try_files $uri /index.php?$query_string; }
        location ~ \.php$ {
            limit_req zone=admission burst=1 nodelay;
            limit_req_status 429;
            limit_conn concurrency 2;
            limit_conn_status 503;
            fastcgi_read_timeout 3s;
            fastcgi_connect_timeout 1s;
            fastcgi_pass app:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/examples/overload-lab/public/index.php;
        }
    }
}
