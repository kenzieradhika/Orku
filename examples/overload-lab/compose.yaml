services:
  app:
    build:
      context: ../..
      dockerfile: examples/overload-lab/Dockerfile
    environment:
      LAB_VARIANT: ${LAB_APP_VARIANT:-${LAB_VARIANT:-baseline}}
      LAB_TEST_OVERLOAD: ${LAB_TEST_OVERLOAD:-0}
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 32
    restart: "no"
    networks: [lab]
    ports: []
    expose: ["9000"]
  nginx:
    image: nginx:1.27-alpine
    command: ["/bin/sh", "-c", "cp /etc/nginx/lab.conf /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"]
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./nginx.${LAB_NGINX_CONFIG:-${LAB_VARIANT:-baseline}}.conf:/etc/nginx/lab.conf:ro
    depends_on: [app]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    restart: "no"
    networks: [lab]
  k6:
    image: grafana/k6:1.8.2
    profiles: [load]
    entrypoint: ["k6"]
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 32
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    volumes:
      - type: bind
        source: ./k6
        target: /scripts
        read_only: true
      - type: bind
        source: ./results
        target: /results
        bind:
          create_host_path: true
    environment:
      LAB_TARGET: http://nginx:8080
      LAB_VARIANT: ${LAB_VARIANT:-baseline}
      LAB_NGINX_CONFIG: ${LAB_NGINX_CONFIG:-${LAB_VARIANT:-baseline}}
      LAB_APP_VARIANT: ${LAB_APP_VARIANT:-${LAB_VARIANT:-baseline}}
      SCENARIO: ${SCENARIO:-baseline}
      RESULT_FILE: ${RESULT_FILE:-/results/result.json}
    networks: [lab]
networks:
  lab:
    internal: true
