name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, xmlwriter, session, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: python3 -m unittest discover -s benchmarks -p 'test_http_latency.py'
      - run: composer install --no-interaction --prefer-dist
      - run: composer check
      - if: matrix.php == '8.4'
        run: python3 tests/apache_check.py
      - if: matrix.php == '8.4'
        run: python3 tests/fpm_check.py
      - if: matrix.php == '8.4'
        run: python3 tests/package_check.py
      - run: php benchmarks/kernel.php 100
      - run: php benchmarks/web.php 100
      - run: composer audit
